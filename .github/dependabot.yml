# Dependabot propose chaque mois les mises a jour de securite et de version.
# npm : sharp (outil local de traitement des images, jamais deploye).
# github-actions : les actions utilisees par le controle automatique.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
